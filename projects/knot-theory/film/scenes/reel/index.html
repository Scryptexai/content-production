<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Knot Theory — reel identitas</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070F; overflow: hidden;
               width: 1920px; height: 1080px; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="S" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>window.DEMO = { width: 1920, height: 1080, fps: 30, duration: 14 };</script>
<script type="module">
/* ==========================================================================
   REEL IDENTITAS — 14 detik, tiga bidikan, tanpa teks sama sekali.
   Menguji tiga hal yang harus dimiliki satu merek sebelum masuk produksi:
     1. karakter terbaca sebagai dirinya di tiga situasi berbeda,
     2. gerak tidak tergelincir (kaki menapak di tempat),
     3. ada satu gagasan visual yang tidak dimiliki kanal lain.

   GAGASAN: benang. Karakter menyeret satu benang dari ekor mantelnya. Di
   akhir, benang itu diikatkan ke titik di udara — bukan dipegang, tapi
   mengikat dirinya. Tidak ada mulut, tidak ada wajah: ceritanya disampaikan
   gerak dan satu garis.

   CATATAN TEKNIS (jangan diubah tanpa mengukur ulang):
   * Kamera mengikuti PINGGUL karakter, dan semua benda dunia (lantai, tanda
     lantai, tangga) digambar dalam lapisan 1:1 tanpa gain parallax. Kalau
     kamera dan benda dunia tidak memakai laju yang sama, kaki tergelincir.
   * Laju jalan tidak ditulis tangan: diambil dari data klip (jarak pinggul
     dibagi durasi), jadi kalau klipnya diubah, kecepatannya ikut.
   ========================================================================== */
import { E, camStyle, clamp, inv, lerp, mk, rng } from "../../lib.js";
import { Character, CT } from "../../char/character.js";

const S = document.getElementById("S");
const el = mk(S);
const DUR = 14;
const FPS = 30;

/* ------------------------------------------------------------------ latar */
const defs = el("defs");

const sky = el("linearGradient", { id: "sky", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
[[0, "#04060E"], [20, "#0A1024"], [40, "#191B36"], [55, "#3B2743"],
 [68, "#6E3F49"], [81, "#AC5F4F"], [92, "#D88761"], [100, "#F2B485"]]
  .forEach(([o, c]) => el("stop", { offset: `${o}%`, "stop-color": c }, sky));

const sunG = el("radialGradient", { id: "sun" }, defs);
el("stop", { offset: "0%", "stop-color": "#FFF2DA" }, sunG);
el("stop", { offset: "46%", "stop-color": "#FBC98F" }, sunG);
el("stop", { offset: "100%", "stop-color": "#E8895E" }, sunG);
const haloG = el("radialGradient", { id: "halo" }, defs);
el("stop", { offset: "0%", "stop-color": "#FFC98F", "stop-opacity": 0.40 }, haloG);
el("stop", { offset: "55%", "stop-color": "#E08B63", "stop-opacity": 0.09 }, haloG);
el("stop", { offset: "100%", "stop-color": "#E08B63", "stop-opacity": 0 }, haloG);
const vig = el("radialGradient", { id: "vig" }, defs);
el("stop", { offset: "38%", "stop-color": "#000", "stop-opacity": 0 }, vig);
el("stop", { offset: "100%", "stop-color": "#000", "stop-opacity": 0.6 }, vig);

/* --------------------------------------------------------------- lapisan
   LAYERS: lapisan parallax (z menentukan gain + blur kedalaman).
   WORLD : lapisan 1:1 — mengikuti kamera persis, tanpa gain. Semua benda
           yang disentuh karakter harus ada di sini.                          */
const LAYERS = {};
const layer = (name, z) => {
  const g = el("g");
  LAYERS[name] = { g, z };
  return g;
};

const gSky = layer("sky", 4000);
el("rect", { x: -900, y: -900, width: 3720, height: 2880, fill: "url(#sky)" }, gSky);

const gStars = layer("stars", 3200);
{
  const r = rng(17);
  for (let i = 0; i < 190; i++) {
    const y = r() * 520;
    el("circle", { cx: (r() * 2400 - 240).toFixed(1), cy: y.toFixed(1),
      r: (0.6 + r() * 1.3).toFixed(2), fill: "#DCE6FF",
      opacity: ((1 - y / 520) * (0.30 + r() * 0.62)).toFixed(3) }, gStars);
  }
}

const gSun = layer("sun", 2600);
el("circle", { cx: 1240, cy: 430, r: 360, fill: "url(#halo)" }, gSun);
el("circle", { cx: 1240, cy: 430, r: 64, fill: "url(#sun)" }, gSun);

const ridge = (seed, baseY, amp, step) => {
  let s = seed >>> 0;
  const rn = () => { s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; };
  let d = `M -900 1600 L -900 ${baseY}`;
  for (let x = -900; x <= 3000; x += step) {
    d += ` L ${x.toFixed(0)} ${(baseY - Math.sin(x * 0.0019 + seed) * amp - rn() * amp * 0.45).toFixed(1)}`;
  }
  return d + " L 3000 1600 Z";
};
const gFar = layer("ridgeFar", 1700);
el("path", { d: ridge(3, 700, 96, 110), fill: "#43395A", opacity: 0.80 }, gFar);
el("path", { d: ridge(9, 752, 58, 100), fill: "#2E2947" }, gFar);
const gMid = layer("ridgeMid", 900);
el("path", { d: ridge(15, 820, 50, 120), fill: "#1D1C33" }, gMid);
const gNear = layer("ridgeNear", 700);
el("path", { d: ridge(21, 886, 40, 130), fill: "#12131F" }, gNear);

/* ---- lapisan dunia (1:1) ---- */
const WORLD = el("g");
const gFloor = el("g", {}, WORLD);          // lantai + tanda lantai
const gStairs = el("g", {}, WORLD);         // tangga
const gChar = el("g", {}, WORLD);           // karakter + benang jejak

/* debu: satu-satunya lapisan yang berdiri sendiri di depan */
const gDust = layer("dust", 300);
const DUST = (() => {
  const r = rng(11);
  return Array.from({ length: 80 }, () => ({ x: r() * 2400 - 240, y: r() * 1140 - 40,
    s: 1.1 + r() * 2.0, sp: 6 + r() * 18, ph: r() * 6.283, k: 0.3 + r() * 0.7 }));
})();
const dustNodes = DUST.map((d) => el("circle", { r: d.s.toFixed(2), fill: "#FFE9CC" }, gDust));

/* ------------------------------------------------------------------ dunia
   GEOMETRI. Tangga dipakai oleh rig: tapak 158, tanjakan 54, 6 anak tangga,
   pijakan pertama di x=430. Di dunia nyata ia diletakkan jauh di kanan,
   tempat karakter berjalan menuju.                                          */
const GROUND = 900;                  // tinggi lantai (y layar, kamera netral)
const RIG_FLOOR = 940;               // y0 rig (tapak ke-0)
const X0 = 430, TR = 158, RI = 54, N = 6, PW = 260, TH = 42;
const STAIR_X = 1560;                // dunia: tepi kiri tangga
const DY = GROUND - RIG_FLOOR;       // geser rig ke lantai

// lantai: pita gelap + tanda lantai (garis pendek) sebagai bukti gerak
el("rect", { x: -4000, y: GROUND, width: 12000, height: 800, fill: "#0A0C15" }, gFloor);
el("rect", { x: -4000, y: GROUND - 2, width: 12000, height: 2.5,
  fill: "#E9A87C", opacity: 0.26 }, gFloor);
const groundMarks = [];
for (let i = 0; i < 120; i++) {
  groundMarks.push(el("rect", { x: -3600 + i * 92, y: GROUND + 26 + (i % 3) * 13,
    width: 34 + (i % 4) * 12, height: 2.2, fill: "#8894AE",
    opacity: (0.05 + (i % 5) * 0.022).toFixed(3) }, gFloor));
}

// tangga
{
  const bx = STAIR_X - X0, by = DY;
  let d = `M ${X0 - 96 + bx} ${RIG_FLOOR + TH + by} L ${X0 - 96 + bx} ${RIG_FLOOR + by}`;
  for (let i = 0; i < N; i++) {
    const x = X0 + i * TR, y = RIG_FLOOR - i * RI;
    d += ` L ${x + TR + bx} ${y + by} L ${x + TR + bx} ${y - RI + by}`;
  }
  const tx = X0 + N * TR, ty = RIG_FLOOR - N * RI;
  d += ` L ${tx + PW + bx} ${ty + by} L ${tx + PW + bx} ${ty + TH + by} L ${X0 - 96 + bx} ${RIG_FLOOR + TH + by} Z`;
  el("path", { d, fill: "#0B0F1C" }, gStairs);
  for (let i = 0; i < N; i++) {
    const x = X0 + i * TR + bx, y = RIG_FLOOR - i * RI + by;
    el("rect", { x, y: y - 9, width: TR, height: 9, fill: "#1C2438" }, gStairs);
    el("rect", { x, y: y - 10.6, width: TR, height: 1.8, fill: "#E9A87C", opacity: 0.5 }, gStairs);
    el("rect", { x: x + TR - 2.2, y: y - RI, width: 2.2, height: RI - 9, fill: "#04060C" }, gStairs);
  }
  el("rect", { x: tx + bx, y: ty + by - 9, width: PW, height: 9, fill: "#1C2438" }, gStairs);
  el("rect", { x: tx + bx, y: ty + by - 10.6, width: PW, height: 1.8, fill: "#E9A87C", opacity: 0.5 }, gStairs);
}

/* bingkai depan: rumput dekat kamera */
const gFg = layer("fg", 130);
{
  const r = rng(23);
  let d = "M -700 1700 L -700 1096";
  for (let x = -700; x <= 2700; x += 110) {
    d += ` L ${x.toFixed(0)} ${(1072 - Math.sin(x * 0.0014) * 24 - r() * 30).toFixed(0)}`;
  }
  el("path", { d: d + " L 2700 1700 Z", fill: "#03040A" }, gFg);
}

const gScreen = el("g");
el("rect", { x: 0, y: 0, width: 1920, height: 1080, fill: "url(#vig)" }, gScreen);

/* ---------------------------------------------------------------- karakter */
const J = await (await fetch("/assets/char-joints.json")).json();
const CL = J.clips;

const trailGlow = el("path", { fill: "none", stroke: CT.lilac, "stroke-width": 13,
  opacity: 0.10, "stroke-linecap": "round" }, gChar);
const trail = el("path", { fill: "none", stroke: CT.lilac, "stroke-width": 3.2,
  opacity: 0.5, "stroke-linecap": "round" }, gChar);

/* simpul di udara: tiga busur trefoil, tiap busur = casing + inti */
const gKnot = el("g", {}, gChar);
const knotSegs = [0, 1, 2].map(() => {
  const casing = el("path", { fill: "none", stroke: "#070A12", "stroke-width": 11,
    "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0 }, gKnot);
  const core = el("path", { fill: "none", stroke: CT.rose, "stroke-width": 5.2,
    "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0 }, gKnot);
  return [casing, core];
});

const figG = el("g", {}, gChar);
const FIG = new Character(figG);

/* ------------------------------------------------------ laju & posisi dunia
   Laju jalan TIDAK ditulis tangan. Diukur dari klip: jarak pinggul dibagi
   durasinya. Kalau klipnya diganti, kecepatannya ikut sendiri. */
const hipX = (clipName, t) => {
  const ps = CL[clipName].poses;
  const i = Math.max(0, Math.min(ps.length - 1, Math.round(t * FPS)));
  return ps[i].hip[0];
};
const WALK_V = 207.4;   // px/s, diukur: hipX(walk,11.3)-hipX(walk,0.3) = 2350
// diverifikasi ulang di konsol saat halaman dimuat (lihat bagian bawah)

const WALK_X0 = 300;

/* --------------------------------------------------------------- TIGA BEAT
   Film ini satu-satunya tempat yang boleh memakai POTONGAN KERAS. Alasannya
   praktis: menyambung klip jalan ke klip tangga tanpa pop itu mahal, dan
   potongan ke hitam 4 frame di antara beat justru terbaca sebagai keputusan
   penyuntingan, bukan kesalahan.                                                        */
const BEAT = [
  { t0: 0.0,  t1: 4.7,  clip: "walk" },
  { t0: 4.8,  t1: 9.4,  clip: "climb" },
  { t0: 9.5,  t1: DUR,  clip: "tie" },     // berdiri di puncak, mengikat
];
const beatAt = (t) => {
  for (const b of BEAT) if (t >= b.t0 && t < b.t1) return b;
  return BEAT[BEAT.length - 1];
};

/* asal klip tangga: rig x=430 harus jatuh di STAIR_X */
const CLIMB_ORIGIN = STAIR_X - X0;

/* jarak dari lantai ke puncak (rig): 6 x 54 */
const CLIMB_TOP_RIG = RIG_FLOOR - N * RI;

function stateAt(t) {
  const b = beatAt(t);
  const local = t - b.t0;

  if (b.clip === "walk") {
    const tt = local % 12;
    return { b, clip: "walk", tt, local,
             originX: WALK_X0 - hipX("walk", 0) + hipX("walk", tt) - hipX("walk", 0),
             dy: DY, mode: "walk" };
  }
  if (b.clip === "climb") {
    const tt = clamp(0.55 + local * 1.06, 0, 11.9);
    return { b, clip: "climb", tt, local, originX: CLIMB_ORIGIN, dy: DY, mode: "climb" };
  }
  // puncak: klip tie sudah berdiri di tapak ke-6 dalam koordinat rig, jadi
  // TIDAK boleh digeser lagi. Menggesernya membuat dia melayang di atas tangga.
  const tt = clamp(local * 1.0, 0, 3.1);
  return { b, clip: "tie", tt, local, originX: CLIMB_ORIGIN, dy: DY, mode: "top" };
}

const hipOf = (clipName, tt) => {
  const ps = CL[clipName].poses;
  return ps[Math.max(0, Math.min(ps.length - 1, Math.round(tt * FPS)))];
};

/* ---------------------------------------------------------------- kamera */
function camAt(t) {
  const st = stateAt(t);
  const p = hipOf(st.clip, st.tt);
  const hipXW = st.originX + p.hip[0];
  const hipYW = st.dy + p.hip[1];

  /* KONVENSI: cam = titik DUNIA yang diletakkan di tengah frame.
     Versi sebelumnya menaruh cam sebagai offset dan menerapkan zoom di
     sekitar titik lain, akibatnya subjek tergeser keluar frame makin jauh
     zoom dinaikkan. Semua mode di bawah memakai satu aturan ini. */
  if (st.mode === "walk") {
    const u = E.ioC(clamp(st.local / 4.7));
    return { x: hipXW + lerp(120, 90, u), y: hipYW - 96, z: lerp(1.06, 1.14, u) };
  }
  if (st.mode === "climb") {
    const u = E.ioC(clamp(st.local / 4.6));
    return { x: hipXW + 70, y: hipYW - lerp(70, 110, u), z: lerp(1.30, 1.46, u) };
  }
  /* puncak: bingkai pinggul DI ATAS tengah, supaya kaki dan tapak tangga
     tetap terlihat. Versi sebelumnya menaruh pinggul di tengah lalu memotong
     kaki di tepi bawah frame. */
  const u = E.ioC(clamp(st.local / 4.5));
  return { x: hipXW + lerp(120, 96, u), y: hipYW + lerp(120, 150, u), z: lerp(1.34, 1.52, u) };
}

function applyCam(t) {
  const c = camAt(t);
  const cam = { x: c.x - 960, y: c.y - 540, zoom: c.z };
  for (const k in LAYERS) {
    const { g, z } = LAYERS[k];
    const st = camStyle(cam, z, 520, (k === "sun" || k === "stars" || k === "sky") ? 0 : 1);
    g.setAttribute("transform", st.transform);
    if (k !== "sun" && k !== "stars" && k !== "sky") g.style.filter = st.filter;
  }
  // dunia: cam adalah titik dunia di tengah frame
  WORLD.setAttribute("transform",
    `translate(960 540) scale(${c.z.toFixed(4)}) translate(${(-c.x).toFixed(2)} ${(-c.y).toFixed(2)})`);
}

/* permukaan kontak, dalam koordinat RIG (yang dipakai draw()) */
function groundRig(an, mode) {
  if (mode === "walk") return RIG_FLOOR;
  const i = Math.max(0, Math.min(N, Math.round((an[0] - X0) / TR)));
  return RIG_FLOOR - i * RI;
}

/* ------------------------------------------------------------- benang jejak
   Jejak = posisi ujung ekor pada waktu-waktu lampau. Dihitung dari klip,
   bukan disimpan — jadi render paralel menghasilkan gambar yang sama. */
function tailSamples(st, n = 22) {
  const out = [];
  for (let k = n; k >= 0; k--) {
    const tt = st.tt - k * 0.05;
    if (tt < 0) continue;
    const p = hipOf(st.clip, tt);
    const x = st.originX + p.hip[0] - 96 - k * 2.6;
    const y = st.dy + p.hip[1] - 26 + Math.sin(tt * 2.2 - k * 0.28) * 5;
    out.push([x, y]);
  }
  return out;
}

window.renderAt = async (t) => {
  applyCam(t);
  const st = stateAt(t);
  const p = hipOf(st.clip, st.tt);

  for (let i = 0; i < DUST.length; i++) {
    const d = DUST[i];
    const y = ((d.y - t * d.sp * d.k) % 1180 + 1180) % 1180 - 40;
    dustNodes[i].setAttribute("cx", (d.x + Math.sin(t * 0.4 + d.ph) * 20).toFixed(1));
    dustNodes[i].setAttribute("cy", y.toFixed(1));
    dustNodes[i].setAttribute("opacity",
      (0.06 + 0.22 * (0.5 + 0.5 * Math.sin(t * 0.9 + d.ph))).toFixed(3));
  }

  // karakter: pinggul di dunia; rig (x,y) → dunia = (originX + x, dy + y)
  figG.setAttribute("transform",
    `translate(${st.originX.toFixed(2)} ${st.dy.toFixed(2)})`);
  FIG.draw(CL[st.clip], st.tt, { ground: (an) => groundRig(an, st.mode) });

  /* BENANG. Saat berjalan benang tetap dipegang ekor mantel (sudah digambar
     di dalam Character) — menambah garis kedua di sini membuatnya terlihat
     seperti kawat lepas di udara. Garis tambahan hanya muncul ketika benang
     diangkat untuk diikat. */
  const hand = [st.originX + p.armL[2][0], st.dy + p.armL[2][1]];
  const tailTip = [st.originX + p.hip[0] - 96, st.dy + p.hip[1] - 26];
  let d = null;
  if (st.mode === "top") {
    const sag = 30 + 10 * Math.sin(t * 1.3);
    d = `M${tailTip[0].toFixed(1)} ${tailTip[1].toFixed(1)}`
      + `Q${(tailTip[0] - 50).toFixed(1)} ${(tailTip[1] + sag).toFixed(1)}`
      + ` ${hand[0].toFixed(1)} ${hand[1].toFixed(1)}`;
  }
  trail.setAttribute("d", d || "M0 0");
  trailGlow.setAttribute("d", d || "M0 0");
  trail.setAttribute("opacity", d ? 0.55 : 0);

  /* SIMPUL. Bukan cincin berombak — cincin berombak terbaca sebagai balon.
     Yang dipakai adalah proyeksi trefoil (simpul tiga silang yang sebenarnya
     bisa diikat dari satu utas), digambar tiga busur berurutan. Tiap busur
     punya "casing" gelap lebih tebal: busur yang digambar belakangan menutup
     busur sebelumnya di titik silang, jadi terbaca sebagai anyaman. */
  const tie = st.mode === "top" ? clamp((st.local - 0.55) / 1.5) : 0;
  if (tie > 0.01) {
    const kx = hand[0] + 116;
    const ky = hand[1] - 96;
    const R = 34 * E.outB(clamp(tie / 0.55), 1.9);
    const spin = 0.5 * (1 - E.outQ(clamp(tie))) - 0.25 * t;
    const TREF = (th) => [
      Math.sin(th) + 2 * Math.sin(2 * th),
      Math.cos(th) - 2 * Math.cos(2 * th),
    ];
    // tiga busur, tiap busur ~2/3 putaran, supaya tiap silang punya atas & bawah
    const SEGS = [
      [0.00, 2.10], [2.10, 4.20], [4.20, 6.30],
    ];
    knotSegs.forEach((pair, si) => {
      const [casing, core] = pair;
      const [a0, a1] = SEGS[si];
      let dd = "";
      const NPT = 30;
      for (let k = 0; k <= NPT; k++) {
        const th = a0 + (a1 - a0) * (k / NPT);
        const [x, y] = TREF(th + spin);
        const px = kx + x * (R / 4.2);
        const py = ky + y * (R / 4.2) * 0.95;
        dd += `${k ? "L" : "M"}${px.toFixed(1)} ${py.toFixed(1)}`;
      }
      casing.setAttribute("d", dd);
      core.setAttribute("d", dd);
      const op = Math.min(1, tie * 2.2).toFixed(2);
      casing.setAttribute("opacity", op);
      core.setAttribute("opacity", op);
    });
    // benang dari tangan ke simpul
    trail.setAttribute("d", d + `L${(kx - R * 0.9).toFixed(1)} ${(ky + R * 0.5).toFixed(1)}`);
    trailGlow.setAttribute("d", trail.getAttribute("d"));
    trail.setAttribute("opacity", 0.55);
  } else {
    knotSegs.forEach(([c, k2]) => { c.setAttribute("opacity", 0); k2.setAttribute("opacity", 0); });
  }

  // potongan: 4 frame hitam di antara beat + fade masuk/keluar film
  let black = 0;
  for (const b of BEAT) {
    black = Math.max(black, E.ioQ(clamp(1 - Math.abs(t - b.t0) / 0.11)));
    black = Math.max(black, E.ioQ(clamp(1 - Math.abs(t - b.t1) / 0.11)));
  }
  const fin = E.ioQ(inv(0, 0.6, t));
  const fout = 1 - E.ioQ(inv(DUR - 0.6, DUR, t));
  S.style.opacity = (Math.min(fin, fout) * (1 - black)).toFixed(3);
};

await window.renderAt(0);
window.__ready = true;
</script>
</body>
</html>
