<title>ODDCHAPTER — print minimum size test</title>
<rect width="180" height="90" fill="#F4F0E8"/>
<text x="8" y="12" font-family="inter" font-weight="600" font-size="2.8222" letter-spacing="0.5644" fill="#17191D" text-anchor="start">PRINT MINIMUM SIZE — TRUE MILLIMETRES</text>
