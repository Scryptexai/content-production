<rect x="10" y="62" width="160" height="0.2" fill="#A7B0A1"/>
<text x="10" y="69" font-family="inter" font-weight="400" font-size="2.2931" fill="#17191D" text-anchor="start" opacity="0.7">Print the sheet at 100 % and check the 8 mm mark at arm's length.</text>
<text x="10" y="74" font-family="inter" font-weight="400" font-size="2.2931" fill="#17191D" text-anchor="start" opacity="0.7">A 100 % scale print is the only test that means anything — a screen cannot fake it.</text>
