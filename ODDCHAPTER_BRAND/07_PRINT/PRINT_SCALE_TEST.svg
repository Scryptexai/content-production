<text x="10" y="50" font-family="inter" font-weight="600" font-size="2.2931" fill="#17191D" text-anchor="start">5 mm</text>
<text x="10" y="55" font-family="inter" font-weight="600" font-size="1.9403" letter-spacing="0.291" fill="#F26A3D" text-anchor="start">TOO SMALL</text>
