<text x="210" y="1092" font-family="Inter" font-weight="400" font-size="16" fill="#17191D" text-anchor="start" opacity="0.68">two annuli — produced by fill-rule, not drawn, so it stays exact at any size.</text>
<text x="210" y="1066" font-family="Inter" font-weight="400" font-size="16" fill="#17191D" text-anchor="start" opacity="0.68">Orange crosses mark the two letter centres on the 10-unit grid. The junction lens is the intersection of</text>
<text x="210" y="1138" font-family="Inter" font-weight="400" font-size="14" fill="#17191D" text-anchor="start" opacity="0.5">Drawing box 96 × 54 u  ·  outer radius 27  ·  counter 14  ·  stroke 13 u  ·  centres 42 u apart  ·  mouth 84°</text>
