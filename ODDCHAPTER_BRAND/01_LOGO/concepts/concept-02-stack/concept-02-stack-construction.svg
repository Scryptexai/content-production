<text x="210" y="1092" font-family="Inter" font-weight="400" font-size="16" fill="#17191D" text-anchor="start" opacity="0.68">gap, so the joint is a real space, not an overlap.</text>
<text x="210" y="1066" font-family="Inter" font-weight="400" font-size="16" fill="#17191D" text-anchor="start" opacity="0.68">Both letters belong to one radius family (outer 22, counter 10, stroke 12). The rule sits in the 10-unit</text>
<text x="210" y="1138" font-family="Inter" font-weight="400" font-size="14" fill="#17191D" text-anchor="start" opacity="0.5">Drawing box 44 × 98 u  ·  outer radius 22  ·  counter 10  ·  stroke 12 u  ·  rule 40 × 9 u  ·  mouth 76°</text>
