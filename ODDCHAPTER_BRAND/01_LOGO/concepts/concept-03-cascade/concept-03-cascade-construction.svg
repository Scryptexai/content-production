<text x="210" y="96" font-family="Space Grotesk" font-weight="700" font-size="40" fill="#17191D" text-anchor="start">03 — CASCADE</text>
<text x="210" y="130" font-family="Inter" font-weight="600" font-size="14" letter-spacing="2.4" fill="#17191D" text-anchor="start" opacity="0.55">GEOMETRIC CONSTRUCTION · 100 UNIT GRID</text>
<text x="210" y="1092" font-family="Inter" font-weight="400" font-size="16" fill="#17191D" text-anchor="start" opacity="0.68">The accent is assigned to the open letter, so colour follows form.</text>
<text x="210" y="1066" font-family="Inter" font-weight="400" font-size="16" fill="#17191D" text-anchor="start" opacity="0.68">Two annuli of equal weight (outer 27, counter 14) set on a rising diagonal, meeting at a 4-unit overlap.</text>
<text x="210" y="1138" font-family="Inter" font-weight="400" font-size="14" fill="#17191D" text-anchor="start" opacity="0.5">Drawing box 97 × 80 u  ·  outer radius 27  ·  counter 14  ·  stroke 13 u  ·  centres 50 u apart  ·  overlap 4 u  ·  mouth 84°</text>
<text x="990" y="96" font-family="Inter" font-weight="600" font-size="13" letter-spacing="2.2" fill="#F26A3D" text-anchor="end">CONCEPT — NOT A FINAL ASSET</text>
