name: Fetch map assets (peta asli → assets/maps/)

# Shot peta Remotion (00G §1b) butuh peta asli Wikimedia yang tidak bisa
# diunduh dari sandbox. Runner mengunduh lalu meng-commit berkasnya.
# Dipicu oleh perubahan assets/maps/SOURCES.json atau workflow ini.

on:
  push:
    paths:
      - "assets/maps/SOURCES.json"
      - "tools/fetch_map_assets.py"
      - ".github/workflows/fetch-map-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asset-runners
  cancel-in-progress: false

jobs:
  fetch:
    name: Unduh peta asli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: pasang pillow
        run: python3 -m pip install -q pillow

      - name: Unduh aset peta
        run: python3 tools/fetch_map_assets.py

      - name: Commit berkas peta
        run: |
          set -euo pipefail
          git config user.name "oddchapter-assets"
          git config user.email "actions@users.noreply.github.com"
          # Pakai direktori (bukan glob): satu pathspec yang tak cocok membuat
          # seluruh `git add` gagal atomik — itulah bug "tidak ada berkas baru".
          git add -f assets/maps/
          if git diff --cached --quiet; then
            echo "::notice::Tidak ada berkas peta baru."
            exit 0
          fi
          ok=0
          for i in 1 2; do
            git fetch origin "${GITHUB_REF_NAME}" || { echo "::error::fetch gagal"; break; }
            git reset --soft "origin/${GITHUB_REF_NAME}" || { echo "::error::reset gagal"; break; }
            git commit --allow-empty -m "assets(maps): peta OSM dirakit dari tile [skip ci]" || { echo "::error::commit gagal"; break; }
            if git push origin HEAD:refs/heads/${GITHUB_REF_NAME}; then ok=1; break; fi
            echo "::warning::push ditolak, coba lagi ($i)"
            sleep 8
          done
          if [ "$ok" != "1" ]; then echo "::error::push peta gagal setelah retry"; exit 1; fi
