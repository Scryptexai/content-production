name: fetch-footage
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_footage.py"
      - "tools/footage_specs/**"
      - "tools/footage_picks/**"
      - ".github/workflows/fetch-footage.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: pasang ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: ambil footage coverr
        run: |
          set -euo pipefail
          # Spec aktif ditunjuk eksplisit lewat tools/footage_specs/ACTIVE.
          # `ls -1t` pernah memilih spec unduh padahal yang dimaksud spec discover.
          SPEC=""
          if [ -f tools/footage_specs/ACTIVE ]; then
            SPEC="tools/footage_specs/$(tr -d '[:space:]' < tools/footage_specs/ACTIVE)"
          fi
          if [ -z "$SPEC" ] || [ ! -f "$SPEC" ]; then
            SPEC=$(ls -1t tools/footage_specs/*.json 2>/dev/null | head -1 || true)
          fi
          echo "spec: ${SPEC:-<bawaan EP01>}"
          if [ -n "$SPEC" ]; then
            MODE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('mode','download'))" "$SPEC")
            CAND=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('candidates_out','footage-candidates.json'))" "$SPEC")
            PICKS=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('picks',''))" "$SPEC")
            echo "mode: $MODE"
            EXTRA=""
            if [ "$MODE" = "discover" ]; then
              EXTRA="--discover --candidates-out $CAND"
            elif [ "$MODE" = "picks" ]; then
              EXTRA="--picks $PICKS"
            fi
            python3 -u tools/fetch_footage.py --spec "$SPEC" $EXTRA > footage-log.txt 2>&1 || echo "EXIT=$?" >> footage-log.txt
          else
            python3 -u tools/fetch_footage.py > footage-log.txt 2>&1 || echo "EXIT=$?" >> footage-log.txt
          fi
          tail -40 footage-log.txt
          du -sh footage/* 2>/dev/null || true
      # artifact Drive/Azure diblokir dari sandbox, jadi hasilnya di-commit saja
      - name: commit hasil ke branch
        run: |
          set -euo pipefail
          git config user.name "footage-bot"
          git config user.email "bot@oddchapter.local"
          for f in footage-report*.json footage-candidates*.json footage-log.txt; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          find footage -name "*.mp4" -print0 2>/dev/null | xargs -0 -r git add -f
          find footage -name "_tmp_*" -print0 2>/dev/null | xargs -0 -r git rm -f --ignore-unmatch -q || true
          # Ambil tip remote dulu (tanpa rebase): kalau ada push baru di tengah run,
          # staged = hasil kerja ini di atas tip terbaru, lalu commit + push.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --soft "origin/${GITHUB_REF_NAME}"
          git commit --allow-empty -m "footage: klip coverr hasil actions [skip ci]"
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
